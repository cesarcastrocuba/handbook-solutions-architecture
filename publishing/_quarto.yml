project:
  type: book
  output-dir: _output

book:
  title: "Solutions Architecture Handbook"
  author: "Franz César Castro Cuba"
  date: "2026-11-06"
  search: true
  repo-url: "https://github.com/cesarcastrocuba/handbook-solutions-architecture"
  repo-actions: [issue]
  navbar:
    right:
      - text: "Handbook Hub"
        href: "https://cesarcastrocuba.github.io/handbooks-hub/"
      - text: "Source"
        href: "https://github.com/cesarcastrocuba/handbook-solutions-architecture/tree/main/manuscript"
      - text: "Downloads"
        href: "https://github.com/cesarcastrocuba/handbook-solutions-architecture/releases"

format:
  html:
    toc: true
    toc-depth: 3
    theme:
      light: cosmo
      dark: cosmo
    respect-user-color-scheme: true
  typst:
    papersize: a4
    toc: true
    toc-depth: 3
  docx:
    toc: true
    toc-depth: 3

execute:
  enabled: false
