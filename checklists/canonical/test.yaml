domain: SA-TEST
title: Testing and quality verification
manuscript: chapters/ch14-testing-and-quality-verification.qmd
items:
- id: SA-TEST-001
  title: Quality scenarios linked to test evidence
  question: Is every priority quality scenario linked to test evidence?
  rationale: A reviewed diagram is not validation; unverified latency, availability or recovery claims surface as production incidents.
  applicability: All priority quality scenarios.
  expected_evidence: Scenario-to-test matrix naming the load, fault-injection, recovery or security test and its recorded result for each priority scenario.
  section: 14.1.4
  external_reference: ''
  risk_relevance: High
  version: '3.0'
  status: active
- id: SA-TEST-002
  title: Risk-proportionate test strategy
  question: Does the test strategy define levels, contract testing, environments, test data and quality gates proportionate to risk?
  rationale: A test strategy without levels, environments, data rules or gates produces late, unreliable feedback and untested claims.
  applicability: All solutions with quality obligations.
  expected_evidence: Current test strategy covering scope, levels, contract testing, environments, test data, tooling, quality gates and exit criteria, with pipeline gate results.
  section: 14.1.1
  external_reference: ''
  risk_relevance: High
  version: '3.0'
  status: active
- id: SA-TEST-003
  title: Flaky tests measured and contained
  question: Are flaky tests measured, quarantined with an owner and an expiry, and kept out of blocking gates?
  rationale: A flaky suite trains teams to ignore red builds, so real failures are merged with the noise.
  applicability: Solutions with automated test pipelines.
  expected_evidence: Flake rate per level; quarantine list with owners and expiry dates; retry counts in pipeline reports.
  section: 14.2.3
  external_reference: ''
  risk_relevance: Medium
  version: '3.0'
  status: active
- id: SA-TEST-004
  title: Quality tests scheduled by trigger
  question: Are security, data-migration and accessibility tests scheduled by trigger rather than run only before the first launch?
  rationale: Quality tests run once for go-live let later releases regress silently.
  applicability: Solutions with security, data or accessibility obligations.
  expected_evidence: Test schedule tying each quality test to its triggers, with results for the latest release, schema change and new external surface.
  section: '14.3'
  external_reference: ''
  risk_relevance: High
  version: '3.0'
  status: active
- id: SA-TEST-005
  title: Release test evidence by version
  question: Can each release show its test results by version, with environment differences and waivers recorded?
  rationale: Evidence that cannot be tied to a version is a claim, and missing records count as missing tests in an audit.
  applicability: Production systems, especially regulated ones.
  expected_evidence: Release records linking artifact digest, gate results, environment differences and waivers with owners and expiries.
  section: 14.4.3
  external_reference: ''
  risk_relevance: High
  version: '3.0'
  status: active
- id: SA-TEST-006
  title: Architecture tests in the pipeline
  question: 'Do architecture tests enforce dependency, boundary, interface and deployment rules in the pipeline, each linked to the decision it protects?'
  rationale: Architecture erodes one change at a time; rules that exist only in documents are not enforced.
  applicability: Systems with layered or modular structure, published interfaces or infrastructure as code.
  expected_evidence: Architecture tests linked to ADRs, failures that blocked a merge, and an exception list with owners and expiries.
  section: 14.3.5
  external_reference: ''
  risk_relevance: High
  version: '3.0'
  status: active
