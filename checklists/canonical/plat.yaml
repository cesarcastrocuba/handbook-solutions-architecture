schema_version: 3.0.0
domain: SA-PLAT
title: Platform
manuscript: chapters/ch17-platform-architecture.qmd
items:
- id: SA-PLAT-001
  title: Platform scope justified by demand
  question: 'Is the platform''s scope justified by measured demand, with its consumers and excluded capabilities stated?'
  rationale: A platform built without measured demand competes with provider services that are good enough and acquires a permanent operating cost.
  applicability: Organizations building or extending an internal platform.
  expected_evidence: Demand analysis with consuming teams and measured duplicated effort, and a scope statement listing included and excluded capabilities.
  section: 17.1.3
  external_reference: ''
  risk_relevance: Medium
  version: '4.0'
  status: active
- id: SA-PLAT-002
  title: Capability ownership, contract and stage
  question: Does each capability have an owner, a published contract and a lifecycle stage?
  rationale: Solutions that depend on a capability without an owner or a contract design against assumptions that change without notice.
  applicability: Every platform capability used by a solution in scope.
  expected_evidence: Capability inventory with owners, current capability contracts and the lifecycle stage of each capability.
  section: 17.5.2
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
- id: SA-PLAT-003
  title: Responsibility split confirmed
  question: Is the responsibility split between the platform and each consuming team documented and confirmed?
  rationale: 'An implicit boundary leaves duties such as restore, patching and alerting to each side''s assumption about the other.'
  applicability: Solutions running on a shared platform.
  expected_evidence: Responsibility matrix per capability confirmed by each consuming team, and a joint restore test.
  section: 17.3.1
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
- id: SA-PLAT-004
  title: Adoption policy per capability
  question: Is the adoption policy stated per capability, with mandated outcomes for required controls?
  rationale: Mandating a convenience turns the platform into a gate, while leaving required controls voluntary makes them uneven.
  applicability: Platforms with several capabilities and consuming teams.
  expected_evidence: Adoption policy per capability, adoption trend of voluntary capabilities and exceptions against mandated outcomes.
  section: 17.2.2
  external_reference: ''
  risk_relevance: Medium
  version: '4.0'
  status: active
- id: SA-PLAT-005
  title: Reviewable interfaces with an escape hatch
  question: Do platform interfaces support review and versioning, with an escape hatch and its responsibilities documented?
  rationale: Manual interfaces cannot be reviewed or repeated, and an abstraction without an exit pushes unusual requirements outside the platform.
  applicability: Platform capabilities consumed by several teams.
  expected_evidence: Interface style and abstraction level per capability, with the documented escape hatch and the responsibilities that move with it.
  section: 17.5.1
  external_reference: ''
  risk_relevance: Medium
  version: '4.0'
  status: active
- id: SA-PLAT-006
  title: Isolation by risk class with quotas
  question: Is the isolation model chosen per risk class and environment, with quotas and tested tenant boundaries?
  rationale: One isolation model for all workloads is either too weak for regulated scopes or too costly for the rest, and missing quotas let one tenant degrade others.
  applicability: Platforms shared by several teams, environments or risk classes.
  expected_evidence: Isolation decision per risk class, quota definitions per tenant and cross-tenant isolation test results.
  section: 17.6.1
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
- id: SA-PLAT-007
  title: Policies owned, tested and with expiring exceptions
  question: Are platform policies versioned, tested and owned, with an exception register that has expiry dates?
  rationale: Untested policies block valid changes or miss violations, and exceptions without expiry become permanent gaps.
  applicability: Platforms that enforce security, compliance or cost policies.
  expected_evidence: Policy inventory with owners, tests and modes, and an exception register with owners, expiry dates and trends per rule.
  section: 17.7.1
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
- id: SA-PLAT-008
  title: Platform objectives and static stability
  question: Does the platform have its own service level objectives, and do running workloads keep serving when its control plane is unavailable?
  rationale: A platform without objectives is a hidden dependency in every solution, and a data plane that depends on the control plane turns provisioning failures into outages.
  applicability: Solutions whose availability depends on a shared platform.
  expected_evidence: Published platform objectives, a dependency map and a test of workload behavior with the control plane unavailable.
  section: 17.8.1
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
- id: SA-PLAT-009
  title: Progressive platform change
  question: Do platform changes roll out progressively, with compatibility checks before each ring?
  rationale: A platform-wide change makes every defect a shared outage.
  applicability: Platforms serving several tenants.
  expected_evidence: Ring definitions, upgrade calendar and compatibility results before each ring.
  section: 17.8.2
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
- id: SA-PLAT-010
  title: Measures against baselines
  question: Are adoption, outcome and cost measures reported against baselines, without ranking teams?
  rationale: Activity counts or rankings make the platform look productive while consumer outcomes stay unchanged, and they invite gaming.
  applicability: Platforms whose investment is reviewed or funded.
  expected_evidence: Baselines taken before adoption, paired adoption and outcome measures, and unit cost reports.
  section: 17.9.2
  external_reference: ''
  risk_relevance: Medium
  version: '4.0'
  status: active
- id: SA-PLAT-011
  title: Sourcing decision with an exit plan
  question: 'Is each capability''s sourcing decision recorded with its lifetime cost and an exit plan?'
  rationale: Commodity capabilities built in-house consume the platform team, and products chosen without an exit plan become the costliest dependency to leave.
  applicability: Platform capabilities that are built, bought or composed.
  expected_evidence: Sourcing decision per capability with lifetime cost, a completed platform assessment and an exit plan with a tested step.
  section: 17.11.2
  external_reference: ''
  risk_relevance: Medium
  version: '4.0'
  status: active
