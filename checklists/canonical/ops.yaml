domain: SA-OPS
title: Deployment and operations
manuscript: chapters/ch15-deployment-and-operations.qmd
items:
- id: SA-OPS-001
  title: One signed artifact promoted everywhere
  question: Is the same signed artifact promoted through every environment?
  rationale: Rebuilding per environment breaks provenance and lets an untested binary reach production.
  applicability: All solutions with automated delivery pipelines.
  expected_evidence: Pipeline record showing an immutable signed artifact digest promoted through environments and traceable back to its commit and build.
  section: 15.1.1
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-OPS-002
  title: Old and new versions coexist safely
  question: Can old and new versions coexist with the current schema and messages?
  rationale: A deployment that requires simultaneous upgrade of code, schema and messages cannot be rolled back incrementally.
  applicability: Changes affecting schemas, messages or multiple services.
  expected_evidence: Expand-migrate-contract plan, compatibility matrix, and old and new application versions tested together against production-like data.
  section: 15.2.2
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-OPS-003
  title: Rollback limits and irreversible steps stated
  question: Are rollback limits stated, including irreversible data changes?
  rationale: Assuming every release is reversible turns a failed change into data loss or an unrehearsed fix-forward.
  applicability: All releases containing destructive or data-changing steps.
  expected_evidence: Release steps marked reversible or forward-only, a rollback decision tree, and a rehearsed fix-forward path with the point of no return identified.
  section: 15.2.2
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-OPS-004
  title: Operational readiness demonstrated in practice
  question: Has operational readiness been demonstrated, not just documented?
  rationale: A successful deployment does not prove the service can be operated, diagnosed or recovered by its on-call team.
  applicability: All services before go-live.
  expected_evidence: Operational readiness review, on-call handover, tested runbooks with commands and verification steps, and a rehearsed critical-path failure.
  section: 15.3.1
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-OPS-005
  title: Branching strategy matches release frequency
  question: Is the branching strategy consistent with the intended release frequency?
  rationale: Long-lived branches recreate merge risk and delay feedback, while trunk-based flow needs strong automation.
  applicability: All teams delivering software continuously or on a schedule.
  expected_evidence: Documented branching model with rationale, protected main branch, required pipeline checks, and measured integration frequency and lead time.
  section: 15.1.3
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-OPS-006
  title: Lightest approval model with auditable evidence
  question: Is each change type routed to the lightest approval model that controls its risk, with auditable evidence?
  rationale: Heavy approval slows delivery without reducing change failure, while weak routing lets high-risk changes bypass control.
  applicability: All production changes under change management.
  expected_evidence: Change-type and approval-model definitions, risk assessment criteria, and pipeline-generated change records linking review, approval and deployment.
  section: 15.4.4
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-OPS-007
  title: Activities written down for each environment
  question: "Is each environment's deployment, testing, operational coverage, owner and data-refresh rule written down, with production data kept out of lower environments?"
  rationale: Undocumented environments acquire production duties without on-call, backups or ownership, and production data leaks downward.
  applicability: All solutions with more than one environment.
  expected_evidence: Activities table per environment with owner, refresh and retirement rules; monitoring parity between staging and production; recovery-site drill records.
  section: 15.1.5
  external_reference: ''
  risk_relevance: Medium
  version: '3.0'
  status: active
