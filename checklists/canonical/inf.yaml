schema_version: 3.0.0
domain: SA-INF
title: Infrastructure
manuscript: chapters/ch12-infrastructure-and-cloud-architecture.qmd
items:
- id: SA-INF-001
  title: Shared responsibility mapped to owners
  question: Is the shared responsibility model mapped to named controls and owners?
  rationale: A managed service transfers operations, not accountability; unmapped provider and customer duties leave controls unowned.
  applicability: All cloud or managed-service workloads.
  expected_evidence: Responsibility matrix mapping each provider and customer control to a named owner and verification method.
  section: '12.1'
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-002
  title: Fault-domain matrix covers every dependency
  question: Does the fault-domain matrix cover data, identity, DNS and third-party dependencies?
  rationale: Redundant compute does not survive a single-zone database, DNS or identity dependency.
  applicability: Solutions claiming high availability.
  expected_evidence: Fault-domain matrix covering compute, data, queues, identity, DNS, secrets and third parties, with zone-failure exercise results.
  section: 12.4.1
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-003
  title: Recovery objectives from business impact
  question: Do RTO and RPO come from business impact and match measured exercise results?
  rationale: RTO and RPO invented by engineering either overspend or fail the business; only measured exercises prove them.
  applicability: Solutions with defined recovery obligations.
  expected_evidence: Business-impact-derived RTO and RPO per capability, matched against dated failover and restore exercise results including data integrity.
  section: 12.4.3
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-004
  title: Every environment rebuildable from code
  question: Can every environment be rebuilt from code?
  rationale: Manual changes create drift and unreproducible environments, making recovery and audit unreliable.
  applicability: All provisioned environments.
  expected_evidence: Infrastructure-as-code definitions with protected state and policy gates, plus an isolated environment rebuilt from source without manual steps.
  section: 12.5.1
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-005
  title: BCP and DRP derived and exercised
  question: Are BCP and DRP derived from a business impact analysis and tested at the interval the contract, regulation or risk assessment sets?
  rationale: Plans untested against a business impact analysis give false confidence and fail under real disruption.
  applicability: Solutions supporting critical business services.
  expected_evidence: Current business impact analysis, BCP and DRP with owners, annual tabletop and restore exercise reports, measured results and closed follow-up actions.
  section: 12.4.3
  external_reference: ISO 22301:2019
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-006
  title: Well-architected review closed on evidence
  question: Has a well-architected review been completed, with findings owned and closed on evidence?
  rationale: A questionnaire answer is not a fixed risk; findings need owners, dates and verified closure.
  applicability: All workloads on a cloud provider with a well-architected framework.
  expected_evidence: Dated per-workload review report, findings register with owners and due dates, and closure evidence linked to ADRs where decisions changed.
  section: 12.7.3
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-INF-007
  title: Owned network and trust-boundary view
  question: Is the network and trust-boundary view owned, covering DNS, certificates, routing, NAT, proxies, firewalls, load balancing and private connectivity?
  rationale: Most cloud outages attributed to the platform are DNS, routing, identity, certificate or egress failures that no product diagram shows.
  applicability: Solutions with private connectivity or multiple trust zones.
  expected_evidence: Network and trust-boundary view with owner, covering DNS, certificates, routing, NAT, proxies, firewalls, load balancing and private connectivity.
  section: '12.2'
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-008
  title: Hybrid and egress failure modes tested
  question: Are hybrid identity, private connectivity and egress failure modes tested against the latency and capacity budgets?
  rationale: Hybrid identity, private links and egress paths fail in ways that appear only under load or during cut-over.
  applicability: Solutions using hybrid identity, private connectivity or restricted egress.
  expected_evidence: Hybrid-connectivity failover results, DNS and certificate failover tests, and measured latency and bandwidth against per-journey budgets.
  section: '12.2'
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-INF-009
  title: Runtime model selected and owned
  question: Is the runtime model selected against workload characteristics, with a named operating owner and a tested platform upgrade path?
  rationale: Runtime platforms adopted by default create unfunded platform work and hidden provider limits.
  applicability: Solutions choosing or changing a compute runtime.
  expected_evidence: Selection record against workload characteristics, named operating owner and a tested upgrade.
  section: '12.3'
  external_reference: ''
  risk_relevance: High
  version: '2.2'
  status: active
- id: SA-INF-010
  title: Edge and device fleet resilience
  question: Where edge or IoT components exist, are disconnected operation, per-device identity and recoverable signed updates designed and tested?
  rationale: Edge fleets operate disconnected and unattended, and a defective update or shared key affects the entire fleet.
  applicability: Solutions with edge locations or IoT devices.
  expected_evidence: Disconnection exercise, per-device identity register, individual revocation test and failed-update recovery test.
  section: '12.6'
  external_reference: ''
  risk_relevance: High
  version: '2.2'
  status: active
- id: SA-INF-011
  title: Request path responsibilities
  question: Does each hop in the request path have one stated responsibility, a timeout budget and trusted handling of forwarded headers?
  rationale: Overlapping intermediaries stack retries and timeouts, and forged forwarding headers defeat rate limits and audit records.
  applicability: Solutions with more than one network intermediary.
  expected_evidence: Request-path view, timeout budget per hop, hop-removal test and forged-header test.
  section: 12.2.3
  external_reference: ''
  risk_relevance: High
  version: '2.2'
  status: active
