schema_version: 3.0.0
domain: SA-ASR
title: Architecture assurance
manuscript: appendices/appendix-c-architecture-assurance-checklist.qmd
items:
- id: SA-ASR-001
  title: Explicit business outcome and scope
  question: Business outcome, scope and constraints are explicit.
  rationale: Without agreed outcomes, scope and constraints every later trade-off is argued from opinion.
  applicability: All solutions.
  expected_evidence: Approved business case or scope statement naming outcomes, in-scope capabilities and a sourced constraint register (1.3).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Intent and decisions
- id: SA-ASR-002
  title: Measurable priority quality scenarios
  question: Priority quality attributes have measurable scenarios.
  rationale: Priority quality attributes without measurable scenarios cannot drive design or be verified.
  applicability: All solutions.
  expected_evidence: Prioritized quality attribute scenarios with workload, environment, response measure and owners (1.4).
  section: C
  external_reference: ISO/IEC 25010:2023
  risk_relevance: High
  version: '2.1'
  status: active
  group: Intent and decisions
- id: SA-ASR-003
  title: Recorded alternatives, risks and ADRs
  question: Alternatives, risks and ADRs are recorded with owners.
  rationale: Decisions without alternatives and owners cannot be reviewed, audited or revisited.
  applicability: All solutions with architecturally significant decisions.
  expected_evidence: ADRs with alternatives, consequences, named owners and review triggers, plus the risk register (3.4).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Intent and decisions
- id: SA-ASR-004
  title: Owned views and interface contracts
  question: Context and container views and interface contracts have owners.
  rationale: Unowned views and contracts become stale and leave interface change without an accountable party.
  applicability: All solutions with external or cross-team interfaces.
  expected_evidence: Context and container views with named owners (13.1), and ICDs with producer and consumer owners plus machine-readable contracts (6.2.3).
  section: C
  external_reference: ISO/IEC/IEEE 42010:2022
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-018
  title: Platform dependencies recorded
  question: Platform dependencies — capability contracts, the responsibility split and the isolation model — are recorded (9.3.1, 9.5.2, 9.6.1).
  rationale: A solution that runs on a shared platform inherits its guarantees and its gaps; unrecorded dependencies are found during incidents and audits.
  applicability: Solutions that use an internal platform or shared platform capabilities.
  expected_evidence: Capability contracts cited by version in the design, the confirmed responsibility matrix and the isolation decision for the solution's risk class.
  section: C
  external_reference: ''
  risk_relevance: High
  version: '4.0'
  status: active
  group: Design
- id: SA-ASR-005
  title: Data ownership, classification and retention
  question: Data ownership, classification and a retention schedule (including files, logs and backups) are defined.
  rationale: Unowned or unclassified data cannot be protected, retained or deleted consistently across copies.
  applicability: All solutions that store business or personal data.
  expected_evidence: Data ownership map, classification matrix and retention schedule covering primary stores, replicas, files, logs and backups (5.2.4, 5.3.1).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-006
  title: Audit trails and change history
  question: Audit trails and data change history meet regulatory and contractual requirements.
  rationale: Regulated data needs verifiable proof of what changed, who changed it and who accessed it.
  applicability: Solutions with regulatory, contractual or financial audit obligations.
  expected_evidence: Audit-event catalog mapped to obligations, history and access-audit coverage, retrieval and tamper tests, and retention with legal holds (10.7.2, 5.3.9).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-007
  title: Threats modeled and controls tested
  question: Threats are modeled and controls mapped to tests.
  rationale: Controls that do not trace to an abuse path or a test provide reassurance rather than assurance.
  applicability: All solutions crossing trust boundaries.
  expected_evidence: Threat model with trust boundaries and ranked threats, and a control-to-test mapping with current results (10.1.1, 10.5).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-008
  title: Recorded privacy decisions and DPIA
  question: Privacy decisions — minimization, retention, transfers, data-subject requests and a DPIA where required — are recorded (10.9).
  rationale: Privacy obligations constrain data flows, residency and retention and are costly to retrofit.
  applicability: Solutions processing personal data.
  expected_evidence: Data protection impact assessment where required, record of processing activities, data inventory and flow map, data-subject request log and transfer register (10.9).
  section: C
  external_reference: GDPR (Regulation (EU) 2016/679)
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-009
  title: Reviewed identity and privileged access
  question: Authentication, SSO and authorization designs are reviewed; privileged access is controlled.
  rationale: Authentication and authorization weaknesses expose every resource behind the interface, including administrative paths.
  applicability: All solutions authenticating users, workloads or administrators.
  expected_evidence: Authentication and SSO design review, authorization tests for cross-tenant access, access-review records and privileged session logs (10.2, 10.3).
  section: C
  external_reference: NIST SP 800-63-4 (2025)
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-010
  title: Security test strategy and remediation targets
  question: The security test strategy (SAST, SCA, authenticated DAST, penetration test) and vulnerability remediation objectives are defined.
  rationale: Without a layered test strategy and remediation objectives, known weaknesses remain untested or indefinitely open.
  applicability: All solutions with custom code or third-party dependencies.
  expected_evidence: Security test plan covering static analysis, composition analysis, authenticated dynamic testing and penetration testing, ASVS mapping and remediation-time objectives (10.5, 10.6).
  section: C
  external_reference: OWASP ASVS 5.0.0 (2025)
  risk_relevance: High
  version: '2.1'
  status: active
  group: Design
- id: SA-ASR-011
  title: Tested recovery and continuity plans
  question: Failure scenarios, RTO/RPO and capacity assumptions are tested; BCP and DRP are current.
  rationale: Untested RTO, RPO and capacity assumptions fail under real disruption, and stale plans mislead responders.
  applicability: Solutions supporting critical business services.
  expected_evidence: Dated exercise reports with measured RTO and RPO, capacity test results, and a current business impact analysis, BCP and DRP with owners (8.2).
  section: C
  external_reference: ISO 22301:2019
  risk_relevance: High
  version: '2.1'
  status: active
  group: Evidence and operations
- id: SA-ASR-012
  title: Framework review and supplier assessment
  question: A cloud well-architected review is completed, and critical suppliers are assessed.
  rationale: Provider guidance and supplier assurance are inherited claims that must be verified in the solution's own scope.
  applicability: Cloud-hosted solutions and solutions depending on critical suppliers.
  expected_evidence: Dated well-architected review with a findings register, and current supplier assurance scoped to the service (8.5, 10.8).
  section: C
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
  group: Evidence and operations
- id: SA-ASR-013
  title: Operationally ready deployment and observability
  question: Deployment, rollback and observability are operationally ready.
  rationale: Deployment success does not prove that a service can be diagnosed, rolled back or recovered by its operators.
  applicability: All services before go-live.
  expected_evidence: Operational readiness review, rollback decision tree, dashboards, SLOs, alerts with runbooks and a rehearsed failure (12.3.1).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Evidence and operations
- id: SA-ASR-014
  title: Test strategy covers scenarios and gates
  question: A test strategy covers priority quality scenarios, contract tests and quality gates.
  rationale: Untested priority scenarios and missing contract tests let incompatible or degraded changes reach production.
  applicability: All solutions with quality obligations.
  expected_evidence: Test strategy mapped to priority quality scenarios, contract test results and pipeline quality-gate records (15.1).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Evidence and operations
- id: SA-ASR-015
  title: Agreed change approval with evidence
  question: The change approval model for the solution is agreed and produces auditable evidence.
  rationale: Change approval that produces no auditable record neither controls risk nor satisfies auditors.
  applicability: All solutions with production change management.
  expected_evidence: Defined change types and authorities, and pipeline-generated change records linking review, approval and deployment (12.4).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Evidence and operations
- id: SA-ASR-016
  title: Governed exceptions with expiry
  question: Governance exceptions have owners, expiry dates and remediation plans.
  rationale: Exceptions without owners, compensating controls or expiry are uncontrolled risk acceptance.
  applicability: All solutions with approved governance exceptions.
  expected_evidence: Exception register entries with scope, owner, compensating controls, residual risk, expiry and remediation plan (4.5).
  section: C
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
  group: Evidence and operations
- id: SA-ASR-017
  title: Accepted operational ownership and runbooks
  question: Operational ownership and runbooks are accepted by the operating team.
  rationale: A service handed over without an accepting operator and usable runbooks becomes an orphaned production risk.
  applicability: All solutions handed over to an operating team.
  expected_evidence: Signed operational handover, runbooks with commands and verification steps, on-call rotation and dependency inventory (12.3.1).
  section: C
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
  group: Evidence and operations
