items:
- id: SA-ART-001
  title: Artifact set proportional to risk
  question: Is the artifact set proportional to the change’s risk and cross-team impact?
  rationale: Producing every artifact for every change creates document theater and erodes trust in the artifacts that matter.
  applicability: All changes producing architecture artifacts.
  expected_evidence: Artifact decision recorded at the start of the work, justified by risk and cross-team impact, with unused artifacts explicitly excluded.
  section: 7.1.2
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-ART-002
  title: Artifact ownership, status and review trigger
  question: Does each artifact have an owner, status, location and review trigger?
  rationale: Documents without owner, status or location drift from reality and are trusted long after they are obsolete.
  applicability: All maintained architecture artifacts.
  expected_evidence: Artifact catalog entry with owner, lifecycle status, authoritative location, review trigger and successor for superseded documents.
  section: 7.5.2
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-ART-003
  title: Artifacts linked by identifier
  question: Are artifacts linked by identifier rather than duplicated?
  rationale: Copying content between documents creates several versions of one fact that drift apart silently.
  applicability: All related architecture artifacts.
  expected_evidence: Identifier links between requirement, ADR, contract, test and runbook, with a sampled end-to-end trace showing no duplicated content.
  section: 7.1.1
  external_reference: ''
  risk_relevance: Low
  version: '2.1'
  status: active
- id: SA-ART-004
  title: Linked artifacts agree on thresholds
  question: Do linked artifacts agree on thresholds, contracts and decisions?
  rationale: Contradictions between artifacts, such as a timeout exceeding the end-to-end target, are defects that reach production if unreviewed.
  applicability: Artifacts that share thresholds, contracts or decisions.
  expected_evidence: Consistency check confirming that timeouts, contracts and decisions agree across linked artifacts, with conflicts logged as defects.
  section: 7.1.1
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
