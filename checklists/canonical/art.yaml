domain: SA-ART
title: Artifacts
manuscript: chapters/ch07-solutions-architecture-artifacts.qmd
items:
- id: SA-ART-001
  title: Artifact set proportional to risk
  question: Is the artifact set proportional to the change’s risk and cross-team impact?
  rationale: Producing every artifact for every change creates document theater and erodes trust in the artifacts that matter.
  applicability: All changes producing architecture artifacts.
  expected_evidence: Artifact decision recorded at the start of the work, justified by risk and cross-team impact, with unused artifacts explicitly excluded.
  section: 7.1.2
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-ART-002
  title: Artifact ownership, status and review trigger
  question: Does each artifact have an owner, status, location and review trigger?
  rationale: Documents without owner, status or location drift from reality and are trusted long after they are obsolete.
  applicability: All maintained architecture artifacts.
  expected_evidence: Artifact catalog entry with owner, lifecycle status, authoritative location, review trigger and successor for superseded documents.
  section: '7.6'
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-ART-003
  title: Artifacts linked by identifier
  question: Are artifacts linked by identifier rather than duplicated?
  rationale: Copying content between documents creates several versions of one fact that drift apart silently.
  applicability: All related architecture artifacts.
  expected_evidence: Identifier links between requirement, ADR, contract, test and runbook, with a sampled end-to-end trace showing no duplicated content.
  section: 7.1.1
  external_reference: ''
  risk_relevance: Low
  version: '2.1'
  status: active
- id: SA-ART-004
  title: Linked artifacts agree on thresholds
  question: Do linked artifacts agree on thresholds, contracts and decisions?
  rationale: Contradictions between artifacts, such as a timeout exceeding the end-to-end target, are defects that reach production if unreviewed.
  applicability: Artifacts that share thresholds, contracts or decisions.
  expected_evidence: Consistency check confirming that timeouts, contracts and decisions agree across linked artifacts, with conflicts logged as defects.
  section: 7.1.1
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-ART-005
  title: Maintained solution description
  question: Does the SAD distinguish implemented and proposed states and reflect accepted changes?
  rationale: An archive of change designs cannot establish the current system architecture and can leave obsolete boundaries in use.
  applicability: Systems with a maintained solution description and successive architecture changes.
  expected_evidence: Versioned SAD linked to the change HLD and ADRs, with affected views verified against the implemented configuration and a named update owner.
  section: 7.2.2
  external_reference: 'https://www.iso.org/standard/74393.html'
  risk_relevance: Medium
  version: '6.0'
  status: active
- id: SA-ART-006
  title: Transition and readiness supported by evidence
  question: Are migration, production readiness and continuity decisions supported by evidence for the same solution version and capability objectives?
  rationale: Approval of a target design does not prove that cutover is safe, operation is staffed or recovery meets business needs.
  applicability: New production capabilities, material migrations, service takeovers and changes to recovery commitments.
  expected_evidence: Rehearsed cutover with reversal limits and reconciliation, readiness criteria and authorized sign-offs, and a capability-level recovery exercise recording observed time, data loss, integrity and owned corrective actions.
  section: '7.5'
  external_reference: 'https://www.iso.org/standard/75106.html'
  risk_relevance: High
  version: '6.0'
  status: active
