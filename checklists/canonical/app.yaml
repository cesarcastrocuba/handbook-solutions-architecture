domain: SA-APP
title: Application
manuscript: chapters/ch11-application-architecture.qmd
items:
- id: SA-APP-001
  title: Boundaries follow ownership and invariants
  question: Do deployable boundaries follow ownership and invariants rather than entities or fashion?
  rationale: Decomposing by entity or fashion creates distributed transactions and chatty dependencies without protecting a business invariant.
  applicability: All solutions with more than one deployable unit or module.
  expected_evidence: Decomposition rationale tracing workflows to owners and invariants, with a service-per-entity alternative explicitly rejected.
  section: 11.1.1
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-APP-002
  title: Inward dependencies enforced automatically
  question: Are dependencies directed inward and enforced by automated checks?
  rationale: Dependency rules that live only in documentation erode with the first urgent change, collapsing the domain boundary.
  applicability: Solutions using layered, hexagonal or clean architecture.
  expected_evidence: Static dependency check in CI that rejects infrastructure imports in domain modules, plus its current passing result.
  section: 11.2.1
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-APP-003
  title: Explicit state machine including unknown outcomes
  question: Are state transitions explicit, including pending and unknown outcomes?
  rationale: Implicit transitions let a provider timeout become a false rejection or a duplicate charge.
  applicability: Solutions with long-running or externally confirmed state changes.
  expected_evidence: State-transition model covering accepted, pending, confirmed, rejected and unknown states, with illegal-transition tests and concurrent-update version checks.
  section: 11.2.2
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-APP-004
  title: Resilience controls composed on one deadline
  question: Are resilience controls composed against one deadline and tested together?
  rationale: Individually reasonable timeouts, retries and circuit breakers can multiply load and exceed the end-to-end budget when combined.
  applicability: Solutions with synchronous dependencies on critical paths.
  expected_evidence: Deadline and retry-budget design, combined fault-injection results under provider outage, and measured p99 latency, request amplification and backlog.
  section: 11.4.2
  external_reference: ''
  risk_relevance: High
  version: '2.1'
  status: active
- id: SA-APP-005
  title: Repository structure supports ownership and releases
  question: Does the repository structure support the intended ownership and release independence?
  rationale: Repository layout shapes build independence, access control and review ownership; an unsuitable model recreates coupling.
  applicability: Solutions with multiple components, teams or release cadences.
  expected_evidence: Documented monorepo or polyrepo decision with a code-owners file, independent pipeline evidence and shared-library versioning rules.
  section: 11.5.3
  external_reference: ''
  risk_relevance: Medium
  version: '2.1'
  status: active
- id: SA-APP-006
  title: Client decisions made per experience
  question: Are client rendering, composition, state and supported versions decided per experience, with domain decisions kept out of client-facing components?
  rationale: Client code runs at versions and on devices the team does not control, so unmade decisions surface as duplicated rules, lost submissions and users who cannot be updated.
  applicability: Solutions with web, mobile or other user-facing clients.
  expected_evidence: Rendering decision per experience, named BFF owner with a rule against domain decisions, client threat model, supported-version matrix, and offline or lost-response replay tests.
  section: 11.6.1
  external_reference: RFC 8252 (2017) for native applications
  risk_relevance: Medium
  version: '2.2'
  status: active
- id: SA-APP-007
  title: Tenancy model and fail-closed isolation
  question: Is the tenancy model decided per layer, with tenant isolation enforced so that a failure closes access, and tested on every path?
  rationale: In shared systems one unscoped query, cache key or background job can expose another customer, and an unmanaged workload can degrade every tenant.
  applicability: Solutions serving more than one customer organization from shared components.
  expected_evidence: ADR with the model per layer and unit cost, automated cross-tenant tests on synchronous and asynchronous paths, per-tenant limits and SLIs, and a single-tenant restore exercise.
  section: 11.7.1
  external_reference: ''
  risk_relevance: High
  version: '2.2'
  status: active
- id: SA-APP-008
  title: Cache strategy and effectiveness
  question: Does every cache have a stated strategy, invalidation rule, worst-case staleness and measured hit ratio?
  rationale: Tiers added one at a time multiply staleness and can add a dependency with little benefit.
  applicability: Solutions that cache data at any layer.
  expected_evidence: Strategy and invalidation rule per item, worst-case staleness, hit-ratio measurements and a cold-start test.
  section: 11.3.4
  external_reference: ''
  risk_relevance: High
  version: '2.2'
  status: active
