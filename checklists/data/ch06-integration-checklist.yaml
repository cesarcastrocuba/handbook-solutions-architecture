items:
  - id: "CHK-CH06-01"
    chapter: 6
    section: "6.2.3"
    domain: "Interface Governance & Contracts"
    question: "Does every interface have named owners, an ICD and a versioned machine-readable contract?"
    verification_method: "Inspect API/event catalog, Interface Control Document (ICD), and OpenAPI/AsyncAPI repository."
    evidence_expected: "Signed ICD naming producer and consumer owners plus versioned OpenAPI/AsyncAPI specification and contract test results."
    severity_if_missing: "High"
    mandatory_or_contextual: "Mandatory"
    tags:
      - "contracts"
      - "icd"
      - "openapi"
      - "asyncapi"
      - "ownership"
    version: "2.0-RC2"
  - id: "CHK-CH06-02"
    chapter: 6
    section: "6.1.2"
    domain: "Integration Style & Trade-off Selection"
    question: "Is the integration style justified against latency, coupling and failure requirements?"
    verification_method: "Review Architecture Decision Record (ADR) and peak-load latency/failure test reports."
    evidence_expected: "Approved ADR justifying synchronous vs. asynchronous style against latency budget, availability coupling, and replay requirements."
    severity_if_missing: "High"
    mandatory_or_contextual: "Mandatory"
    tags:
      - "adr"
      - "integration-style"
      - "latency-budget"
      - "coupling"
    version: "2.0-RC2"
  - id: "CHK-CH06-03"
    chapter: 6
    section: "6.3.1"
    domain: "Reliable Delivery & Idempotency"
    question: "Are publication (outbox) and processing (idempotent consumer) protected separately?"
    verification_method: "Inspect database transaction boundaries, transactional outbox relay, and consumer deduplication constraint/tests."
    evidence_expected: "Outbox table and relay implementation, consumer unique constraint on (consumer_name, event_id) or provider idempotency key, and fault-injection test results."
    severity_if_missing: "Critical"
    mandatory_or_contextual: "Mandatory"
    tags:
      - "transactional-outbox"
      - "idempotent-consumer"
      - "at-least-once"
      - "consistency"
    version: "2.0-RC2"
  - id: "CHK-CH06-04"
    chapter: 6
    section: "6.4.4"
    domain: "Failure Recovery & Reconciliation"
    question: "Are unknown outcomes resolved by reconciliation rather than blind retries?"
    verification_method: "Inspect timeout handling, dead-letter queue (DLQ) replay procedure, and automated reconciliation job."
    evidence_expected: "Runbook and reconciliation job comparing orders, ledger, and provider records, plus alerts on oldest unresolved pending item."
    severity_if_missing: "Critical"
    mandatory_or_contextual: "Mandatory"
    tags:
      - "reconciliation"
      - "dlq"
      - "unknown-outcomes"
      - "retries"
    version: "2.0-RC2"
  - id: "CHK-CH06-05"
    chapter: 6
    section: "6.2.6"
    domain: "API Design & Lifecycle Governance"
    question: "Do APIs follow the style guide, with consistent errors, pagination and a deprecation policy?"
    verification_method: "Inspect API style guide linting in CI, RFC 9457 error responses, cursor pagination, and RFC 9745/8594 deprecation headers."
    evidence_expected: "Passing CI API lint report, RFC 9457 Problem Details schema tests, bounded pagination parameters, and documented deprecation policy."
    severity_if_missing: "Medium"
    mandatory_or_contextual: "Mandatory"
    tags:
      - "api-design"
      - "rfc-9457"
      - "pagination"
      - "deprecation"
      - "style-guide"
    version: "2.0-RC2"
